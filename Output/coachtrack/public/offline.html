<!doctype html>
<!--
  מסך "אין חיבור" — הדבר **היחיד** שה-service worker שומר ב-cache.

  הוא קיים כדי שהחלופה ל"אין רשת" לא תהיה מסך לבן, ובמפורש **לא** כדי
  להחליף את האפליקציה: אין בו קוד, אין בו נתונים, ואין בו שום דבר שיכול
  להתיישן. index.html לעולם לא נכנס ל-cache (ראה sw.js), ולכן אין מצב שבו
  משתמש מקבל גרסה ישנה של האפליקציה מה-service worker.

  ⚠️ הטקסט העברי כאן יושב בקובץ ולא ב-i18n/he.ts, כמו הטקסט ב-index.html —
  זה קובץ סטטי שנטען בלי React, ולכן אין לו גישה ל-t(). זו החריגה היחידה
  מכלל 8 בשלב הזה, והיא מוגבלת לשלושה משפטים.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>CoachTrack — אין חיבור</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: Rubik, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        color: #475569;
        line-height: 1.6;
      }
      button {
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        background: #0f172a;
        color: #fff;
        font: inherit;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>אין חיבור לאינטרנט</h1>
      <p>
        CoachTrack צריך חיבור כדי להציג את התוכנית ואת הדיווחים. בדוק את החיבור ונסה שוב.
      </p>
      <button type="button" onclick="location.reload()">נסה שוב</button>
    </main>
  </body>
</html>
