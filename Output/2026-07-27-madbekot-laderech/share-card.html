<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#E4F1FC; --tint:#EAF4FD; --text:#17497F; --royal:#1B5FA6; --navy:#123A63;
    --cta:#E06E10; --cta-deep:#C85D0E; --teal:#35A9C4; --yellow:#FFC53D;
    --font-head:"Varela Round","Segoe UI",system-ui,Arial,sans-serif;
    --font-body:"Assistant","Segoe UI",system-ui,Arial,sans-serif;
    --font-display:"Frank Ruhl Libre","Times New Roman",serif;
  }
  html,body{background:#c9def0;}
  .card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    background:
      radial-gradient(circle at 12% 20%, rgba(53,169,196,.10), transparent 40%),
      radial-gradient(circle at 88% 85%, rgba(255,197,61,.14), transparent 42%),
      var(--bg);
    font-family:var(--font-body);color:var(--text);display:flex;align-items:stretch;
  }
  /* sprinkles */
  .deco{position:absolute;line-height:1;pointer-events:none;}
  .d1{top:40px;right:520px;font-size:30px;color:var(--yellow);transform:rotate(-12deg);}
  .d2{top:120px;right:60px;font-size:22px;color:var(--teal);}
  .d3{bottom:60px;right:360px;font-size:26px;color:var(--royal);}
  .d4{bottom:40px;left:520px;font-size:24px;color:var(--yellow);transform:rotate(10deg);}

  /* text side (right in RTL) */
  .text{flex:1 1 0;padding:56px 60px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2;}
  .brand-logo{height:40px;width:auto;margin-bottom:22px;opacity:.95;border-radius:6px;}
  .title{font-family:var(--font-display);font-weight:900;font-size:78px;line-height:1.15;color:var(--text);letter-spacing:.5px;}
  .sub{font-size:30px;font-weight:700;color:var(--royal);margin-top:16px;line-height:1.35;max-width:19ch;}
  .hook{
    margin-top:30px;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;
    background:linear-gradient(90deg,var(--cta) 0%,var(--cta-deep) 100%);color:#fff;
    font-family:var(--font-head);font-size:28px;padding:14px 26px;border-radius:999px;
    box-shadow:0 8px 20px rgba(224,110,16,.30);
  }

  /* photo side (left in RTL) */
  .photo{flex:0 0 470px;position:relative;padding:34px 0 34px 34px;display:flex;align-items:center;}
  .photo .frame{width:100%;height:100%;border-radius:26px;overflow:hidden;border:8px solid #fff;
    box-shadow:0 14px 40px rgba(23,73,127,.22);}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;}
</style>
</head>
<body>
<div class="card">
  <span class="deco d1">✦</span>
  <span class="deco d2">★</span>
  <span class="deco d3">♥</span>
  <span class="deco d4">✦</span>

  <div class="text">
    <img class="brand-logo" src="assets/logo-haderech.jpg" alt="הדרך למילים">
    <div class="title">מַדְבֵּקוֹת לַדֶּרֶךְ</div>
    <div class="sub">54 מדבקות מחזקות לילדים — לכריך, לקלמר ולשקית האוכל</div>
    <div class="hook">מבצע חזרה ללימודים 🎒 · החל מ-24 ₪</div>
  </div>

  <div class="photo">
    <div class="frame">
      <img src="assets/2026-08-madbekot-share-sheets.jpg" alt="גיליונות מדבקות לדרך המנוקדים — משפטים מחזקים לילדים" style="object-position:50% 42%;">
    </div>
  </div>
</div>
</body>
</html>
