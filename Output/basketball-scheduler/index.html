<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>מערכת שעות אימוני כדורסל</title>

    <!-- Installable to the home screen. The name and icon are product-level, not
         club-level: one deployment serves many clubs, so the installed icon must not
         carry any one association's crest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2355a5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />

    <!-- iOS ignores the manifest for these; it needs its own tags. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="לו״ז אימונים" />
  </head>
  <body class="bg-stone-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
